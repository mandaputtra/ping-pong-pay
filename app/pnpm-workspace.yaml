# pnpm reads build approvals from here, not from package.json.
allowBuilds:
  esbuild: true
  lightningcss: true
  # bufferutil / keccak / utf-8-validate are optional native accelerators for viem
  # and its websocket transport. Every one of them ships a pure-JS fallback, so
  # leaving them unbuilt is correct for a container: building them needs
  # python3 + make + g++ in the image purely to compile a speed-up we do not
  # need on a public demo. This is also why the container build failed before.
  keccak: false
  bufferutil: false
  # Transitive dependency we do not import. Listed explicitly because pnpm treats
  # an unlisted build script as a hard error rather than skipping it.
  "@reown/appkit": true
  utf-8-validate: false