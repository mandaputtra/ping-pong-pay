# fly.toml app configuration file generated for ping-pong-pay-relayer on 2026-10-07T23:56:02+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ping-pong-pay-relayer'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.relayer'

[env]
  PORT = '8791'
  RELAYER_PORT = '8791'

[http_service]
  internal_port = 8791
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
